<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#08080F"/>

  <!-- Sun rays -->
  <g stroke="#FBBF24" stroke-width="22" stroke-linecap="round">
    <line x1="256" y1="110" x2="256" y2="148"/>
    <line x1="340" y1="136" x2="318" y2="167"/>
    <line x1="172" y1="136" x2="194" y2="167"/>
    <line x1="370" y1="200" x2="335" y2="210"/>
    <line x1="142" y1="200" x2="177" y2="210"/>
  </g>

  <!-- Sun circle (half, sits on horizon) -->
  <clipPath id="above">
    <rect x="0" y="0" width="512" height="272"/>
  </clipPath>
  <circle cx="256" cy="272" r="72" fill="#FBBF24" clip-path="url(#above)"/>

  <!-- Horizon lines -->
  <line x1="100" y1="272" x2="412" y2="272" stroke="#60A5FA" stroke-width="14" stroke-linecap="round"/>
  <line x1="130" y1="310" x2="382" y2="310" stroke="#60A5FA" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
  <line x1="165" y1="344" x2="347" y2="344" stroke="#60A5FA" stroke-width="7" stroke-linecap="round" opacity="0.3"/>
</svg>
