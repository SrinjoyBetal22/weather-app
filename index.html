<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-decor">
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
    </div>
    <div class="app-shell">
        <nav class="navbar">
            <a href="#" class="nav-brand">Weather</a>
            <button id="themeToggle" class="nav-btn" aria-label="Toggle theme">
                <i data-lucide="sun"></i>
                <i data-lucide="moon"></i>
            </button>
        </nav>

        <main class="app-content">
            <div class="container">
                <div class="favorites" id="favorites"></div>
                
                <div class="search-box">
                    <input type="text" id="cityInput" placeholder="Search city...">
                    <button id="searchBtn">
                        <i data-lucide="search"></i>
                    </button>
                </div>

                <div id="loader" class="loader-container hidden">
                    <span class="loader"></span>
                </div>

                <div id="weatherResult" class="weather-result hidden">
                    <button id="addFavBtn" class="add-fav-btn hidden">
                        <i data-lucide="star"></i>
                        <span>Save <span id="favCityName"></span></span>
                    </button>
                    
                    <div class="main-card">
                        <div class="weather-main">
                            <div class="weather-icon-wrap" id="weatherIconLarge"></div>
                            <div class="weather-info">
                                <h2 id="cityName"></h2>
                                <p id="description" class="weather-desc"></p>
                                <div class="temp-row">
                                    <span id="temperature" class="main-temp"></span>
                                    <span class="weather-meta" id="highLow"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="details-grid">
                        <div class="detail-item">
                            <i data-lucide="thermometer"></i>
                            <span class="label">Feels like</span>
                            <span class="value" id="feelsLike"></span>
                        </div>
                        <div class="detail-item">
                            <i data-lucide="droplets"></i>
                            <span class="label">Humidity</span>
                            <span class="value" id="humidity"></span>
                        </div>
                        <div class="detail-item">
                            <i data-lucide="wind"></i>
                            <span class="label">Wind</span>
                            <span class="value" id="windSpeed"></span>
                        </div>
                    </div>
                </div>

                <div id="forecastContainer" class="forecast-container hidden">
                    <h3 class="forecast-title">5-Day Forecast</h3>
                    <div id="forecastList" class="forecast-list"></div>
                </div>

                <p id="errorMessage" class="error hidden"></p>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
