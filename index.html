<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmos Weather</title>

    <!-- Primary meta -->
    <meta name="description" content="Atmos — liquid glass weather. Current conditions, 5-day forecasts, and sunrise/sunset for any city worldwide.">
    <meta name="theme-color" content="#08080F">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Atmos Weather">
    <meta property="og:description" content="Beautiful, minimal weather for any city. Liquid glass design, no API key needed.">
    <meta property="og:image" content="./og-preview.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Atmos Weather">
    <meta name="twitter:description" content="Beautiful, minimal weather for any city.">
    <meta name="twitter:image" content="./og-preview.png">

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Atmos">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-decor">
        <div class="aurora-blob blob-1"></div>
    </div>

    <header class="site-header">
        <span class="nav-brand">ATMOS</span>
        <button id="themeToggle" class="btn btn-ghost" aria-label="Toggle theme">
            <i class="ri-sun-line hidden" id="sunIcon" aria-hidden="true"></i>
            <i class="ri-moon-line" id="moonIcon" aria-hidden="true"></i>
        </button>
    </header>

    <main>
        <div class="container">
            <div class="favorites" id="favorites"></div>

            <div class="search-box">
                <button id="locationBtn" class="btn btn-ghost location-btn" aria-label="Use my location">
                    <i class="ri-map-pin-user-line" aria-hidden="true"></i>
                    <span class="location-btn-label">My Location</span>
                </button>
                <input type="text" id="cityInput" class="input" placeholder="Find your city..." aria-label="City name">
                <button id="searchBtn" class="btn btn-primary" aria-label="Search">
                    <i class="ri-search-line" aria-hidden="true"></i>
                    <span class="search-btn-label">Search</span>
                </button>
            </div>

            <div id="loader" class="loader-container hidden" aria-live="polite" aria-label="Loading weather data">
                <span class="loader"></span>
                <span class="loader"></span>
                <span class="loader"></span>
            </div>

            <div id="weatherResult" class="glass-card weather-card hidden">
                <div class="weather-main">
                    <div class="weather-icon-wrap" id="weatherIconLarge" aria-hidden="true"></div>
                    <div class="weather-info">
                        <div class="weather-info-top">
                            <div class="weather-info-text">
                                <h2 id="cityName" class="city-name"></h2>
                                <p id="description" class="weather-desc"></p>
                            </div>
                            <button id="addFavBtn" class="save-city-btn hidden" title="Save to favorites" aria-label="Save to favorites">
                                <i class="ri-bookmark-line" aria-hidden="true"></i>
                            </button>
                        </div>
                        <div class="temp-block">
                            <span id="temperature" class="main-temp"></span>
                            <span id="highLow" class="high-low"></span>
                        </div>
                    </div>
                </div>

                <div class="details-grid">
                    <div class="detail-item">
                        <i class="ri-temp-hot-line" aria-hidden="true"></i>
                        <span class="label">Feels like</span>
                        <span class="value" id="feelsLike"></span>
                    </div>
                    <div class="detail-item">
                        <i class="ri-water-percent-line" aria-hidden="true"></i>
                        <span class="label">Humidity</span>
                        <span class="value" id="humidity"></span>
                    </div>
                    <div class="detail-item">
                        <i class="ri-windy-line" aria-hidden="true"></i>
                        <span class="label">Wind</span>
                        <span class="value" id="windSpeed"></span>
                    </div>
                </div>

                <div id="sunTimes" class="sun-times hidden">
                    <span class="sun-item">
                        <i class="ri-sun-rise-line" aria-hidden="true"></i>
                        <span class="sun-label">Sunrise</span>
                        <span id="sunriseTime" class="sun-time"></span>
                    </span>
                    <div id="sunTrack" class="sun-track hidden" aria-hidden="true">
                        <div id="sunTrackFill" class="sun-track-fill"></div>
                    </div>
                    <span class="sun-item">
                        <i class="ri-sun-set-line" aria-hidden="true"></i>
                        <span class="sun-label">Sunset</span>
                        <span id="sunsetTime" class="sun-time"></span>
                    </span>
                </div>

                <div id="lastUpdated" class="last-updated hidden"></div>
            </div>

            <div id="forecastContainer" class="glass-card forecast-container hidden">
                <h3 id="forecastTitle" class="section-title">5-Day Forecast</h3>
                <div id="forecastList" class="forecast-list"></div>
            </div>

            <p id="errorMessage" class="error hidden" role="alert"></p>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
        }
    </script>
</body>
</html>
