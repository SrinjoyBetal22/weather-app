<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-decor">
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
    </div>
    
    <div class="app-shell">
        <header class="site-header">
            <a href="#" class="nav-brand">NEBULA</a>
            <button id="themeToggle" class="btn btn-ghost" aria-label="Toggle theme">
                <i class="ri-sun-line" id="sunIcon"></i>
                <i class="ri-moon-line" id="moonIcon" class="hidden"></i>
            </button>
        </header>

        <main class="app-content">
            <div class="container">
                <div class="favorites" id="favorites"></div>
                
                <div class="search-box">
                    <input type="text" id="cityInput" class="input" placeholder="Find your city...">
                    <button id="searchBtn" class="btn btn-primary">
                        <i class="ri-search-line"></i>
                        <span>Search</span>
                    </button>
                </div>

                <div id="loader" class="loader-container hidden">
                    <span class="loader"></span>
                    <span class="loader"></span>
                    <span class="loader"></span>
                </div>

                <div id="weatherResult" class="glass-card weather-card hidden">
                    <div class="card-header">
                        <button id="addFavBtn" class="fav-btn hidden">
                            <i class="ri-star-line"></i>
                            <span>Save <span id="favCityName"></span></span>
                        </button>
                    </div>
                    
                    <div class="weather-main">
                        <div class="weather-icon-wrap" id="weatherIconLarge"></div>
                        <div class="weather-info">
                            <h2 id="cityName" class="city-name"></h2>
                            <p id="description" class="weather-desc"></p>
                            <div class="temp-row">
                                <span id="temperature" class="main-temp"></span>
                                <span class="weather-meta" id="highLow"></span>
                            </div>
                        </div>
                    </div>

                    <div class="details-grid">
                        <div class="detail-item">
                            <i class="ri-temp-hot-line"></i>
                            <span class="label">Feels like</span>
                            <span class="value" id="feelsLike"></span>
                        </div>
                        <div class="detail-item">
                            <i class="ri-water-percent-line"></i>
                            <span class="label">Humidity</span>
                            <span class="value" id="humidity"></span>
                        </div>
                        <div class="detail-item">
                            <i class="ri-windy-line"></i>
                            <span class="label">Wind</span>
                            <span class="value" id="windSpeed"></span>
                        </div>
                    </div>
                </div>

                <div id="forecastContainer" class="forecast-container hidden">
                    <h3 class="section-title">Next 5 Days</h3>
                    <div id="forecastList" class="forecast-list"></div>
                </div>

                <p id="errorMessage" class="error hidden"></p>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
